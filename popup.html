<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: -apple-system, sans-serif; background: #f9fafb; margin: 0; }
    h3 { margin-top: 0; font-size: 16px; color: #111827; }
    textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-family: monospace; font-size: 12px; box-sizing: border-box; resize: none; margin-bottom: 10px; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12px; color: #10b981; text-align: center; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Initial Investigation Formatter</h3>
  <textarea id="inputBox" placeholder="Paste initial investigation Comment block here..."></textarea>
  <button id="formatBtn">Format & Copy</button>
  <div id="status">Copied to clipboard!</div>

  <script src="popup.js"></script> 
</body>
</html>
